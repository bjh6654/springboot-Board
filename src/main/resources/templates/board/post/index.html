<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${postDTO.title} + ' - 게시판'">게시글 상세</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        /* 헤더 */
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        .header-link:hover {
            opacity: 1;
        }

        .login-link {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-block;
        }

        /* 메인 컨테이너 */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 뒤로가기 링크 */
        .breadcrumb {
            margin-bottom: 24px;
            font-size: 14px;
        }

        .breadcrumb a {
            color: #667eea;
            text-decoration: none;
            transition: all 0.3s;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        /* 게시글 카드 */
        .post-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* 게시글 헤더 */
        .post-header {
            padding: 32px 0px 16px 32px;
            border-bottom: 1px solid #eee;
        }

        .post-title {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        /* 메타정보 */
        .post-meta {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #666;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-label {
            font-weight: 600;
            color: #333;
        }

        .meta-value {
            color: #666;
        }

        .meta-divider {
            width: 1px;
            height: 16px;
            background: #eee;
            margin: 0 8px;
        }

        /* 게시글 본문 */
        .post-content {
            padding: 32px;
            line-height: 1.8;
            font-size: 15px;
            color: #333;
            word-break: break-word;
            white-space: pre-wrap;
            min-height: 300px;
        }

        /* 게시글 푸터 */
        .post-footer {
            padding: 24px 32px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            background: #f9f9f9;
        }

        .post-actions {
            display: flex;
            gap: 12px;
        }

        /* 버튼 */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #f8f9fa;
            color: #dc3545;
            border: 1px solid #dc3545;
        }

        .btn-danger:hover {
            background: #fce8e6;
        }

        .btn-outline {
            background: white;
            color: #667eea;
            border: 1px solid #667eea;
        }

        .btn-outline:hover {
            background: #f0f0f0;
        }

        /* 게시판 링크 */
        .back-to-board {
            color: white;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            transition: all 0.3s;
        }

        .back-to-board:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .reply-table {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding-left: 20px;
        }

        .reply-content {
            padding: 10px 0px;
            white-space: pre-wrap;
            word-wrap: break-word;
            flex: 1;
            min-width: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f9f9f9;
            border-bottom: 2px solid #ddd;
        }

        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #555;
        }

        .reply-author {
            color: #999;
        }

        .reply-date {
            color: #999;
            font-size: 10px;
        }
        .back-to-board:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .reply-deleted {
            color: #999;
            font-weight: bold;
        }

        .reply-create-card {
            margin-top: 24px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .reply-create-header {
            display: flex;
            padding: 20px 32px;
            border-bottom: 1px solid #eee;
            background: #f9f9f9;
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .reply-form {
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .reply-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 110px;
            transition: all 0.3s;
        }

        .reply-textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        .reply-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            align-items: center;
            margin-left: auto;
        }

        .reply-main{
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .reply-action-btn{
          width: 25px;       /* 두 버튼 동일 크기 */
          height: 25px;
          line-height: 25px;
          padding: 0;
        }

        .reply-delete-x {
            background: none !important;           /* 배경 완전 제거 */
            border: none !important;               /* 테두리 제거 */
            color: #ff4757 !important;             /* 빨간색 */
            font-size: 16px !important;            /* X 크기 */
            font-weight: bold !important;
            cursor: pointer !important;
            padding: 2px 6px !important;           /* 여백 최소화 */
            margin-left: 8px !important;
            line-height: 1 !important;
            vertical-align: middle !important;
            width: 24px !important;
            height: 24px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            border-radius: 50% !important;         /* 원형 */
            transition: all 0.2s ease !important;
            position: relative !important;
            box-sizing: border-box !important;
        }

        .reply-delete-x:hover {
            color: #ff3838 !important;             /* 더 진한 빨강 */
            transform: scale(1.2) !important;      /* 확대 */
        }

        .reply-delete-x:active {
            transform: scale(0.95) !important;     /* 클릭시 축소 */
        }

        /* 반응형 */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
            }

            .header-right {
                width: 100%;
                justify-content: flex-end;
            }

            .container {
                padding: 16px;
                margin: 20px auto;
            }

            .post-header {
                padding: 20px;
            }

            .post-content {
                padding: 20px;
                min-height: auto;
            }

            .post-footer {
                padding: 16px 20px;
                flex-direction: column;
                align-items: stretch;
            }

            .post-actions {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .post-title {
                font-size: 22px;
            }

            .post-meta {
                flex-direction: column;
                gap: 12px;
            }

            .meta-divider {
                display: none;
            }
        }
    </style>
</head>
<body>
<!-- 헤더 -->
<header>
    <div class="header-left">
        <h1>게시판</h1>
    </div>
    <div class="header-right">
        <div sec:authorize="isAuthenticated()">
            <span th:text="${memberDTO.name}"></span>
            <a href="/auth/logout" class="login-link">로그아웃</a>
        </div>
        <div sec:authorize="isAnonymous()">
            <a href="/auth/loginPage" class="login-link">로그인</a>
        </div>
    </div>
</header>

<!-- 메인 컨테이너 -->
<div class="container">
    <!-- 브레드크럼 -->
    <div class="breadcrumb">
        <a href="/board">게시판</a>
        <span> / </span>
        <span th:text="${postDTO.title}">게시글 제목</span>
    </div>

    <!-- 게시글 카드 -->
    <div class="post-card">
        <!-- 게시글 헤더 -->
        <div class="post-header">
            <h1 class="post-title" th:text="${postDTO.title}">게시글 제목</h1>

            <!-- 메타정보 -->
            <div class="post-meta">
                <div class="meta-item">
                    <span class="meta-label">작성자:</span>
                    <span class="meta-value" th:text="${postDTO.authorName}">작성자명</span>
                </div>

                <div class="meta-item">
                    <span class="meta-label">작성일:</span>
                    <span class="meta-value" th:text="${#temporals.format(postDTO.createdAt, 'yyyy-MM-dd HH:mm')}">2025-12-19 13:30</span>
                </div>

                <div class="meta-item" th:if="${postDTO.updatedAt != null && postDTO.updatedAt != postDTO.createdAt}">
                    <span class="meta-label">수정일:</span>
                    <span class="meta-value" th:text="${#temporals.format(postDTO.updatedAt, 'yyyy-MM-dd HH:mm')}">2025-12-19 14:00</span>
                </div>
            </div>
        </div>

        <!-- 게시글 본문 -->
        <div class="post-content" th:text="${postDTO.content}">
            게시글 내용이 여기에 표시됩니다.
        </div>

        <!-- 게시글 푸터 -->
        <div class="post-footer">
            <div class="post-actions">
                <a href="/board" class="btn btn-outline">← 목록</a>
                <div sec:authorize="!hasAuthority('ADMIN')" th:if="${postDTO.authorId == memberDTO.id}">
                    <button class="btn btn-secondary" th:onclick="|location.href='@{/board/post/edit(postId=${postDTO.id})}'|">✏️ 수정</button>
                    <button class="btn btn-danger" th:onclick="|location.href='@{/board/post/delete(postId=${postDTO.id})}'|">🗑️ 삭제</button>
                </div>
                <div sec:authorize="hasAuthority('ADMIN')" >
                    <button class="btn btn-danger" th:onclick="|location.href='@{/board/post/delete(postId=${postDTO.id})}'|">🗑️ 삭제</button>
                </div>
            </div>
        </div>

        <div class="reply-table">
            <table>
                <tbody>
                    <th:block th:each="reply : ${postDTO.replies}">
                        <tr th:replace="~{board/post/component/reply :: replyItem(
                            reply=${reply},
                            depth=0,
                            memberDTO=${memberDTO},
                            postDTO=${postDTO}
                        )}">
                        </tr>
                    </th:block>
                </tbody>
            </table>
        </div>
    </div>

    <div class="reply-create-card">
        <div class="reply-create-header">
            <span>댓글 작성</span>
            <span id="reply-parent-badge" class="reply-parent-badge" style="display:none; color: #999; font-weight: bold; margin-left: 20px;">
                <span class="badge bg-secondary">
                  <span id="reply-parent-text"></span>
                  <button type="button" class="reply-action-btn reply-reply-btn"
                          aria-label="부모댓글 선택 해제"
                          onclick="clearCurrentTargetReply()">
                      X
                  </button>
                </span>
            </span>
        </div>


        <form class="reply-form"
              action="/board/post/reply"
              method="post"
              th:object="${replyDTO}"
              onsubmit="return validateForm()">
<!--            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">-->
            <input type="hidden" th:field="*{postId}"/>
            <input type="hidden" th:field="*{parentId}" id="parentReplyId"/>
            <textarea class="reply-textarea"
                      name="content"
                      placeholder="댓글을 입력하세요..."
                      required
                      th:field="*{content}"
            ></textarea>

            <div class="reply-actions">
                <button type="submit" class="btn btn-primary">댓글 등록</button>
            </div>
        </form>
    </div>

</div>

<script>
    function confirmDelete(postId) {
        if (confirm('정말 삭제하시겠습니까?')) {
            location.href = `/board/${postId}/delete`;
        }
    }

    function truncate(str, max) {
      if (!str) return "";
      return str.length > max ? str.slice(0, max - 1) + "…" : str; // 또는 "..."
    }

    function setCurrentTargetReply(btn) {
      const parentId = btn.dataset.parentReplyId;
      const parentAuthor = btn.dataset.parentAuthor;
      const content = truncate(btn.dataset.replyContent, 20);

      // hidden input 세팅
      document.getElementById('parentReplyId').value = parentId;

      // 뱃지 표시
      document.getElementById('reply-parent-text').textContent =
          `@${parentAuthor} [${content}]`;
      document.getElementById('reply-parent-badge').style.display = 'block';

      // 작성칸으로 포커스 이동(선택)
      const textarea = document.querySelector('.reply-textarea');
      if (textarea) textarea.focus();
    }

    function clearCurrentTargetReply() {
      document.getElementById('parentReplyId').value = '';
      document.getElementById('reply-parent-badge').style.display = 'none';
      document.getElementById('reply-parent-text').textContent = '';
    }

</script>
</body>
</html>
